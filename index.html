<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0F0F0F"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Coach de Voz"/>
<title>Coach de Voz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0F0F0F;overscroll-behavior:none;font-family:Georgia,'Times New Roman',serif;color:#F0EDE6}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button{cursor:pointer;font-family:inherit}
button:active{opacity:0.75}
textarea,input{font-family:inherit;box-sizing:border-box}
textarea:focus,input:focus{outline:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:#0F0F0F}
::-webkit-scrollbar-thumb{background:#2A2A2A;border-radius:2px}

.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}

/* HOME */
#home{background:#0F0F0F;overflow-y:auto}
.header{padding:32px 20px 0}
.title-top{font-size:11px;letter-spacing:4px;color:#555;text-transform:uppercase;margin-bottom:6px}
.title-main{font-size:28px;line-height:1.25;font-weight:normal}
.title-main em{color:#E8C547;font-style:italic}
.streak-box{background:#141414;border:1px solid #222;border-radius:12px;padding:10px 16px;text-align:center;flex-shrink:0}
.streak-fire{font-size:22px}
.streak-num{font-size:13px;color:#E8C547;font-family:monospace}
.streak-lbl{font-size:10px;color:#555}

.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:20px}
.stat-card{background:#141414;border:1px solid #1E1E1E;border-radius:10px;padding:10px;text-align:center}
.stat-val{font-size:20px;font-family:monospace}
.stat-lbl{font-size:10px;color:#555;margin-top:2px}

.tabs{display:flex;margin:24px 20px 0;background:#141414;border-radius:12px;padding:4px;border:1px solid #1E1E1E}
.tab{flex:1;background:none;color:#555;border:none;border-radius:9px;padding:8px 4px;font-size:11px;font-family:inherit}
.tab.active{background:#E8C547;color:#0F0F0F}

.tab-content{padding:20px}
.tab-panel{display:none}
.tab-panel.active{display:block}

.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.filter-btn{border-radius:20px;padding:5px 12px;font-size:11px;border:1px solid #2A2A2A;background:#141414;color:#666;font-family:inherit}
.filter-btn.active{background:#E8C547;color:#0F0F0F;border-color:#E8C547}

.ex-card{background:#141414;border:1px solid #1E1E1E;border-radius:14px;padding:18px;text-align:left;width:100%;margin-bottom:12px;border-left-width:3px}
.ex-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.badge{font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;border-radius:20px}
.ex-meta{font-size:10px;color:#555;display:flex;align-items:center;gap:8px}
.ex-titulo{font-size:16px;color:#F0EDE6;margin-bottom:6px;text-align:left}
.ex-inst{font-size:12px;color:#555;line-height:1.5;text-align:left}

.sim-card{background:#141414;border:1px solid #222;border-radius:14px;padding:18px;text-align:left;width:100%;margin-bottom:12px;border-left-width:3px}
.sim-titulo{font-size:16px;color:#F0EDE6;margin-bottom:6px}
.sim-desc{font-size:12px;color:#555;line-height:1.5}
.sim-papel{font-size:11px;margin-top:10px}

.dica-card{background:#141414;border:1px solid #1E1E1E;border-radius:14px;padding:18px;margin-bottom:14px;border-left-width:3px}
.dica-titulo{font-size:15px;color:#F0EDE6;margin-bottom:8px}
.dica-texto{font-size:13px;color:#888;line-height:1.7}

.prog-cat{margin-bottom:14px}
.prog-cat-row{display:flex;justify-content:space-between;margin-bottom:6px}
.pbar-wrap{background:#1A1A1A;border-radius:20px;height:6px;overflow:hidden}
.pbar{height:100%;border-radius:20px;transition:width 0.8s ease}
.hist-item{background:#141414;border:1px solid #1E1E1E;border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.hist-titulo{font-size:13px;color:#C0BDB6}
.hist-sub{font-size:11px;color:#555;margin-top:2px}
.hist-score{font-size:13px;color:#47E8B8;font-family:monospace}
.empty-state{text-align:center;padding:40px 0;color:#444}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-txt{font-size:14px}

/* EXERCÍCIO */
#exercicio{background:#0F0F0F}
.ex-header{background:#141414;border-bottom:1px solid #1E1E1E;padding:20px 20px 16px;flex-shrink:0}
.back-btn{background:none;border:none;color:#666;font-size:13px;font-family:inherit;margin-bottom:12px;padding:0;display:block}
.ex-header-titulo{font-size:21px;margin-top:10px;line-height:1.3}
.ex-body{padding:20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;flex:1}
.card-section{background:#141414;border:1px solid #1E1E1E;border-radius:12px;padding:16px}
.card-label{font-size:10px;letter-spacing:3px;color:#555;text-transform:uppercase;margin-bottom:8px}
.card-text{font-size:14px;color:#C0BDB6;line-height:1.7}
.prompt-card{border-radius:12px;padding:16px}
.prompt-text{font-size:16px;color:#F0EDE6;line-height:1.7;font-style:italic}
.dica-box{display:flex;gap:10px;padding:12px 14px;background:#0A0A0A;border-radius:10px;border:1px solid #1A1A1A}
.dica-icon{font-size:16px;flex-shrink:0}
.dica-tip{font-size:13px;color:#666;line-height:1.6}

.crono-num{font-size:34px;font-family:monospace;letter-spacing:4px;text-align:center}
.crono-bar-wrap{background:#1A1A1A;border-radius:20px;height:4px;margin:6px 0 10px}
.crono-bar{height:100%;border-radius:20px;transition:width 1s linear}
.crono-btn{display:block;margin:0 auto;border-radius:20px;padding:6px 18px;font-size:12px;border:1px solid #2A2A2A}

.mode-toggle{display:flex;background:#141414;border:1px solid #1E1E1E;border-radius:10px;padding:3px}
.mode-btn{flex:1;border:none;border-radius:8px;padding:8px;font-size:13px;font-family:inherit}

/* GRAVADOR */
.gravador{background:#0A0A0A;border:1px solid #1E1E1E;border-radius:16px;padding:20px}
.grav-label{font-size:10px;letter-spacing:3px;color:#555;text-transform:uppercase;margin-bottom:14px}
.visualizer{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:50px;margin-bottom:14px}
.bar{width:5px;border-radius:3px;transition:height 0.08s ease,background 0.3s}
.grav-tempo{text-align:center;margin-bottom:10px;font-family:monospace;font-size:22px;color:#E87C47}
.grav-controls{display:flex;justify-content:center;gap:12px;margin-bottom:14px}
.grav-btn-rec{border:none;border-radius:50%;width:60px;height:60px;font-size:24px}
.grav-btn-stop{border:none;border-radius:50%;width:60px;height:60px;font-size:18px;background:#E87C47;color:#fff;animation:pulseBtn 1.2s infinite}
.grav-btn-reset{background:#1A1A1A;color:#888;border:1px solid #2A2A2A;border-radius:20px;padding:8px 20px;font-size:13px}
.grav-erro{color:#E87C47;font-size:12px;text-align:center;margin-bottom:8px}
.trans-box{background:#141414;border:1px solid #222;border-radius:10px;padding:14px;margin-bottom:14px}
.trans-label{font-size:10px;letter-spacing:2px;color:#555;margin-bottom:6px}
.trans-text{font-size:14px;color:#C0BDB6;line-height:1.7}
.analise-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.analise-card{background:#141414;border-radius:10px;padding:10px;text-align:center}
.analise-val{font-size:20px;font-family:monospace}
.analise-lbl{font-size:10px;color:#555;margin-top:2px}
.vicios-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.vicio-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:#E87C4722;color:#E87C47}

.textarea-resp{width:100%;min-height:110px;background:#141414;border:1px solid #2A2A2A;border-radius:12px;padding:16px;color:#F0EDE6;font-size:15px;line-height:1.7;resize:vertical}
.btn-feedback{border:none;border-radius:12px;padding:16px;font-size:15px;font-family:inherit;width:100%}
.fb-box{background:#141414;border:1px solid #2A2A2A;border-radius:14px;padding:20px;animation:fadeIn 0.4s ease}
.fb-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px}
.fb-text{font-size:14px;color:#C0BDB6;line-height:1.8}
.btn-proximo{border:none;border-radius:10px;padding:12px;font-size:13px;font-family:inherit;width:100%;margin-top:16px;cursor:pointer}

/* SIMULAÇÃO */
#simulacao{background:#0F0F0F}
.sim-header{background:#141414;border-bottom:1px solid #1E1E1E;padding:18px 20px;flex-shrink:0}
.chat-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;border-radius:14px;padding:12px 16px;font-size:14px;line-height:1.7}
.msg.user{align-self:flex-end;border-radius:14px 14px 4px 14px;color:#F0EDE6}
.msg.bot{align-self:flex-start;background:#141414;border:1px solid #222;border-radius:14px 14px 14px 4px;color:#C0BDB6}
.typing{display:flex;gap:5px;padding:12px 16px;background:#141414;border:1px solid #222;border-radius:14px 14px 14px 4px;width:fit-content}
.typing-dot{width:6px;height:6px;background:#555;border-radius:50%}
.chat-input-row{background:#141414;border-top:1px solid #1E1E1E;padding:12px 16px;display:flex;gap:10px;flex-shrink:0}
.chat-input{flex:1;background:#0F0F0F;border:1px solid #2A2A2A;border-radius:10px;padding:10px 14px;color:#F0EDE6;font-size:14px}
.chat-send{border:none;border-radius:10px;padding:10px 16px;font-size:16px}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1)}}
@keyframes pulseBtn{0%,100%{box-shadow:0 0 0 0 rgba(232,124,71,0.4)}50%{box-shadow:0 0 0 10px rgba(232,124,71,0)}}
</style>
</head>
<body>

<!-- ══ HOME ══ -->
<div id="home" class="screen active">
  <div class="header">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div class="title-top">Coach de Comunicação</div>
        <div class="title-main">Sua Voz,<br><em>Sua Presença.</em></div>
      </div>
      <div class="streak-box">
        <div class="streak-fire">🔥</div>
        <div class="streak-num" id="streakNum">0</div>
        <div class="streak-lbl">dias</div>
      </div>
    </div>
    <div class="stats-grid" id="statsGrid" style="display:none">
      <div class="stat-card"><div class="stat-val" id="statSessoes" style="color:#E8C547">0</div><div class="stat-lbl">Sessões</div></div>
      <div class="stat-card"><div class="stat-val" id="statScore" style="color:#47B8E8">0%</div><div class="stat-lbl">Score médio</div></div>
      <div class="stat-card"><div class="stat-val" id="statStreak" style="color:#E87C47">0d</div><div class="stat-lbl">Streak</div></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setAba('treino')">Treino</button>
    <button class="tab" onclick="setAba('sim')">Simulação</button>
    <button class="tab" onclick="setAba('prog')">Progresso</button>
    <button class="tab" onclick="setAba('dicas')">Dicas</button>
  </div>

  <div class="tab-content">
    <!-- TREINO -->
    <div id="panel-treino" class="tab-panel active">
      <div class="filter-row">
        <button class="filter-btn active" onclick="setFiltro(null,this)">Hoje</button>
        <button class="filter-btn" onclick="setFiltro('dicao',this)">🗣️</button>
        <button class="filter-btn" onclick="setFiltro('publico',this)">🎤</button>
        <button class="filter-btn" onclick="setFiltro('smalltalk',this)">💬</button>
      </div>
      <div id="lista-exercicios"></div>
    </div>

    <!-- SIMULAÇÃO -->
    <div id="panel-sim" class="tab-panel">
      <p style="font-size:13px;color:#666;margin-bottom:18px;line-height:1.6">Pratique situações reais com a IA no papel do interlocutor. Feedback ao final.</p>
      <div id="lista-sims"></div>
    </div>

    <!-- PROGRESSO -->
    <div id="panel-prog" class="tab-panel">
      <div id="prog-content"></div>
    </div>

    <!-- DICAS -->
    <div id="panel-dicas" class="tab-panel">
      <p style="font-size:13px;color:#666;margin-bottom:18px;line-height:1.6">Técnicas dos melhores coaches e metodologias de comunicação.</p>
      <div id="lista-dicas"></div>
    </div>
  </div>
</div>

<!-- ══ EXERCÍCIO ══ -->
<div id="exercicio" class="screen">
  <div class="ex-header">
    <button class="back-btn" onclick="voltarHome()">← Voltar</button>
    <span class="badge" id="ex-badge"></span>
    <div class="ex-header-titulo" id="ex-titulo"></div>
  </div>
  <div class="ex-body" id="ex-body"></div>
</div>

<!-- ══ SIMULAÇÃO ══ -->
<div id="simulacao" class="screen">
  <div class="sim-header">
    <button class="back-btn" onclick="voltarHome()">← Encerrar</button>
    <span class="badge" id="sim-badge"></span>
  </div>
  <div class="chat-area" id="chat-area"></div>
  <div class="chat-input-row">
    <input class="chat-input" id="chat-input" placeholder="Escreva sua fala..." onkeydown="if(event.key==='Enter')enviarMsg()"/>
    <button class="chat-send" id="chat-send" onclick="enviarMsg()">→</button>
  </div>
</div>

<script>
// ── DADOS ─────────────────────────────────────────────────────────────────────
const CATS = {
  dicao:     {label:"Dicção",           emoji:"🗣️", cor:"#E8C547"},
  publico:   {label:"Falar em Público", emoji:"🎤", cor:"#E87C47"},
  smalltalk: {label:"Small Talk",       emoji:"💬", cor:"#47B8E8"},
};

const EX = [
  {id:1,cat:"dicao",    titulo:"Trava-língua progressivo", inst:"Grave-se repetindo 3 vezes, acelerando a cada rodada.",                                                                              prompt:"O rato roeu a roupa do rei de Roma",                                                                                                                                         dica:"Clareza antes de velocidade. Cada sílaba deve ser distinta.",                                                        min:5},
  {id:2,cat:"dicao",    titulo:"Leitura com pausas",       inst:"Leia em voz alta pausando em cada vírgula e ponto.",                                                                                 prompt:"O mercado financeiro, assim como a natureza, opera em ciclos. Quem aprende a identificá-los, age com calma quando os outros entram em pânico.",                              dica:"Respire antes de frases longas. Não acelere no final.",                                                              min:5},
  {id:3,cat:"dicao",    titulo:"Vogais abertas",           inst:"Fale cada palavra bem devagar, exagerando as vogais.",                                                                               prompt:"Extraordinário • Oportunidade • Autoridade • Elaborado • Inevitável",                                                                                                       dica:"Abra bem a boca. Sinta cada vogal.",                                                                                 min:5},
  {id:4,cat:"publico",  titulo:"Ponto de vista em 60s",    inst:"Grave-se por 60 segundos defendendo uma posição clara.",                                                                             prompt:'"O trabalho remoto é mais produtivo do que o presencial."',                                                                                                                  dica:"Estruture: Posição → 2 argumentos → Conclusão.",                                                                    min:7},
  {id:5,cat:"publico",  titulo:"Abertura impactante",      inst:"Grave uma abertura de 30s para uma apresentação.",                                                                                   prompt:"Como o Brasil pode liderar o agronegócio sustentável global",                                                                                                               dica:"Comece com pergunta ou dado surpreendente. Nunca com 'Bom dia, meu nome é...'",                                     min:5},
  {id:6,cat:"publico",  titulo:"Improviso PREP",           inst:"Grave 90s usando: Ponto → Razão → Exemplo → Ponto.",                                                                                 prompt:'"Por que comunicação clara vale mais do que qualquer planilha."',                                                                                                            dica:"O método PREP é a base de todo bom improviso.",                                                                     min:10},
  {id:7,cat:"smalltalk",titulo:"Pergunta aberta",          inst:"Grave como você iniciaria a conversa com uma pergunta aberta.",                                                                      prompt:"Você está num evento e encontra um colega recém-chegado de Portugal.",                                                                                                       dica:"Perguntas abertas começam com 'Como', 'O que', 'Me conta'.",                                                        min:5},
  {id:8,cat:"smalltalk",titulo:"Técnica FORD",             inst:"Grave 4 perguntas usando: Família, Ocupação, Recreação, Desejos.",                                                                   prompt:"Jantar de negócios com um investidor que você acabou de conhecer.",                                                                                                          dica:"FORD cria conversas naturais sem parecer interrogatório.",                                                           min:7},
  {id:9,cat:"smalltalk",titulo:"Saída elegante",           inst:"Grave como você encerraria essa conversa de forma calorosa.",                                                                        prompt:"Você está numa conversa de 20min num coquetel e precisa circular.",                                                                                                          dica:"Resume algo positivo da conversa e deixa a porta aberta.",                                                          min:5},
];

const SIMS = [
  {id:"s1",titulo:"Pitch de 2 minutos",    cenario:"Você tem 2 minutos para convencer um investidor a ouvir mais sobre sua ideia. O investidor é cético mas aberto.",  papel:"investidor cético mas curioso", cor:"#B847E8"},
  {id:"s2",titulo:"Reunião difícil",       cenario:"Você precisa dar um feedback negativo a um colega sobre sua performance, mantendo o relacionamento.",                papel:"colega que recebe o feedback",  cor:"#E87C47"},
  {id:"s3",titulo:"Small talk executivo",  cenario:"Você está num elevador com um CEO que admira. Tem 60 segundos antes do andar dele.",                                papel:"CEO ocupado mas receptivo",     cor:"#47B8E8"},
  {id:"s4",titulo:"Entrevista de emprego", cenario:"Primeira pergunta: 'Me conta um pouco sobre você e por que quer essa posição.'",                                    papel:"entrevistador experiente",      cor:"#E8C547"},
  {id:"s5",titulo:"Apresentação de dados", cenario:"Você precisa explicar resultados ruins do trimestre para o board sem soar na defensiva.",                           papel:"board member questionador",     cor:"#47E8B8"},
];

const DICAS = [
  {titulo:"Respiração diafragmática", texto:"Inspire pelo nariz por 4s, segure 4s, expire pela boca por 6s. Faça antes de qualquer fala importante.", cat:"dicao"},
  {titulo:"A regra dos 3 pontos",     texto:"Nunca tente passar mais de 3 mensagens numa fala. Escolha os 3 mais importantes e desenvolva cada um.", cat:"publico"},
  {titulo:"Escuta ativa",             texto:"Em small talks, use 70% do tempo ouvindo e 30% falando. Pergunte sobre o que a pessoa acabou de dizer.", cat:"smalltalk"},
  {titulo:"Pausas estratégicas",      texto:"Uma pausa de 2 segundos antes de um ponto importante aumenta o impacto percebido em até 40%.", cat:"publico"},
  {titulo:"Espelhamento",             texto:"Repita as últimas 3-4 palavras da pessoa em forma de pergunta. Ela vai continuar falando e sentirá que você é um ótimo ouvinte.", cat:"smalltalk"},
];

const VICIOS = ["né","tipo","assim","então","daí","aí","hmm","bom","certo","ok","tá","cara","sabe","entendeu","na verdade","basicamente","literalmente","obviamente","enfim"];

// ── ESTADO ────────────────────────────────────────────────────────────────────
let hist = [];
try { hist = JSON.parse(localStorage.getItem("vc_h")||"[]"); } catch(e){}
let exAtual = null, simAtual = null, filtroAtual = null;
let cronoInt = null, cronoSeg = 0, cronoAtivo = false;
let gravEstado = "idle", gravTempo = 0, gravInt = null;
let recognition = null, textoFinal = "", transAtual = "", analiseAtual = null;
let audioCtx = null, analyser = null, micStream = null, animFrame = null;
let barrasEls = [];
let modoEntrada = "voz";
let simMsgs = [], simLoad = false;

function salvarHist(item) {
  hist.push(item); if(hist.length>50) hist.shift();
  try { localStorage.setItem("vc_h", JSON.stringify(hist)); } catch(e){}
}

function analisar(txt) {
  if(!txt||txt.length<5) return null;
  const palavras = txt.toLowerCase().split(/\s+/).filter(Boolean);
  const total = palavras.length;
  const vic = {};
  palavras.forEach(p => { const l=p.replace(/[^a-záéíóúãõâêîôûç]/g,""); if(VICIOS.includes(l)) vic[l]=(vic[l]||0)+1; });
  const tv = Object.values(vic).reduce((a,b)=>a+b,0);
  const score = Math.max(0, Math.round(100-(tv/Math.max(total,1))*200));
  return {total,vic,tv,score};
}

// ── NAVEGAÇÃO ─────────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function voltarHome() {
  pararGravacao(); pararVisualizador(); clearInterval(cronoInt);
  showScreen("home");
  renderProgresso(); atualizarStats();
}

// ── ABAS ──────────────────────────────────────────────────────────────────────
function setAba(aba) {
  document.querySelectorAll(".tab").forEach((t,i)=>{
    const ids=["treino","sim","prog","dicas"];
    t.classList.toggle("active", ids[i]===aba);
  });
  document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
  document.getElementById("panel-"+aba).classList.add("active");
  if(aba==="prog") renderProgresso();
}

function setFiltro(cat, btn) {
  filtroAtual = cat;
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderExercicios();
}

// ── RENDER LISTAS ─────────────────────────────────────────────────────────────
function exDia() {
  const d = new Date().getDay();
  return EX.filter((_,i)=>i%3===d%3);
}

function renderExercicios() {
  const lista = filtroAtual ? EX.filter(e=>e.cat===filtroAtual) : exDia();
  const el = document.getElementById("lista-exercicios");
  el.innerHTML = lista.map(e => {
    const c = CATS[e.cat];
    const feito = hist.some(h=>h.titulo===e.titulo&&Date.now()-h.data<86400000);
    return `<button class="ex-card" style="border-left-color:${c.cor}" onclick="abrirExercicio(${e.id})">
      <div class="ex-card-top">
        <span class="badge" style="background:${c.cor}22;color:${c.cor}">${c.emoji} ${c.label}</span>
        <div class="ex-meta"><span>🎙 ${e.min}min</span>${feito?"<span>✅</span>":""}</div>
      </div>
      <div class="ex-titulo">${e.titulo}</div>
      <div class="ex-inst">${e.inst.substring(0,70)}...</div>
    </button>`;
  }).join("");
}

function renderSims() {
  document.getElementById("lista-sims").innerHTML = SIMS.map(s=>`
    <button class="sim-card" style="border-left-color:${s.cor}" onclick="abrirSim('${s.id}')">
      <div style="margin-bottom:8px"><span class="badge" style="background:${s.cor}22;color:${s.cor}">🎭 Simulação</span></div>
      <div class="sim-titulo">${s.titulo}</div>
      <div class="sim-desc">${s.cenario.substring(0,80)}...</div>
      <div class="sim-papel" style="color:${s.cor}">Papel da IA: ${s.papel} →</div>
    </button>`).join("");
}

function renderDicas() {
  document.getElementById("lista-dicas").innerHTML = DICAS.map(d=>{
    const c=CATS[d.cat];
    return `<div class="dica-card" style="border-left-color:${c.cor}">
      <div style="margin-bottom:8px"><span class="badge" style="background:${c.cor}22;color:${c.cor}">${c.emoji} ${c.label}</span></div>
      <div class="dica-titulo">${d.titulo}</div>
      <div class="dica-texto">${d.texto}</div>
    </div>`;
  }).join("");
}

function renderProgresso() {
  const el = document.getElementById("prog-content");
  if(!hist.length) {
    el.innerHTML=`<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-txt">Complete seus primeiros exercícios<br>para ver seu progresso aqui.</div></div>`;
    return;
  }
  let html = `<div style="font-size:11px;letter-spacing:3px;color:#555;text-transform:uppercase;margin-bottom:14px">Por categoria</div>`;
  Object.keys(CATS).forEach(k=>{
    const count=hist.filter(h=>h.cat===k).length;
    if(!count) return;
    const c=CATS[k];
    html+=`<div class="prog-cat">
      <div class="prog-cat-row"><span style="font-size:13px;color:#C0BDB6">${c.emoji} ${c.label}</span><span style="font-size:13px;color:${c.cor};font-family:monospace">${count}×</span></div>
      <div class="pbar-wrap"><div class="pbar" style="width:${Math.min(count*20,100)}%;background:${c.cor}"></div></div>
    </div>`;
  });
  html+=`<div style="font-size:11px;letter-spacing:3px;color:#555;text-transform:uppercase;margin:20px 0 14px">Histórico recente</div>`;
  [...hist].reverse().slice(0,6).forEach(h=>{
    const c=CATS[h.cat];
    html+=`<div class="hist-item">
      <div><div class="hist-titulo">${h.titulo}</div><div class="hist-sub">${c?c.label:"?"} · ${new Date(h.data).toLocaleDateString("pt-BR")}</div></div>
      <div class="hist-score">${Math.round(h.score||75)}%</div>
    </div>`;
  });
  el.innerHTML=html;
}

function atualizarStats() {
  const total=hist.length;
  const score=total?Math.round(hist.reduce((a,b)=>a+(b.score||75),0)/total):0;
  document.getElementById("statsGrid").style.display=total?"grid":"none";
  document.getElementById("statSessoes").textContent=total;
  document.getElementById("statScore").textContent=score+"%";
  document.getElementById("statStreak").textContent="3d";
  document.getElementById("streakNum").textContent=3;
}

// ── EXERCÍCIO ─────────────────────────────────────────────────────────────────
function abrirExercicio(id) {
  exAtual = EX.find(e=>e.id===id);
  if(!exAtual) return;
  const c = CATS[exAtual.cat];
  modoEntrada = "voz"; textoFinal=""; transAtual=""; analiseAtual=null;
  document.getElementById("ex-badge").textContent=`${c.emoji} ${c.label}`;
  document.getElementById("ex-badge").style.cssText=`background:${c.cor}22;color:${c.cor};font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;border-radius:20px`;
  document.getElementById("ex-titulo").textContent=exAtual.titulo;
  renderExBody();
  showScreen("exercicio");
}

function renderExBody() {
  const c=CATS[exAtual.cat]; const cor=c.cor;
  cronoSeg=exAtual.min*60; cronoAtivo=false; clearInterval(cronoInt);

    <div style="text-align:center">
      <div class="crono-num" id="crono-num" style="color:#F0EDE6">${fmtTime(cronoSeg)}</div>
      <div class="crono-bar-wrap"><div class="crono-bar" id="crono-bar" style="width:0%;background:${cor}"></div></div>
      <button class="crono-btn" id="crono-btn" style="background:#E8C547;color:#0F0F0F;border:1px solid #2A2A2A" onclick="toggleCrono()">▶ Iniciar</button>
    </div>
    <div class="card-section">
      <div class="card-label">Instrução</div>
      <div class="card-text">${exAtual.inst}</div>
    </div>
    <div class="prompt-card" style="background:${cor}11;border:1px solid ${cor}33">
      <div class="card-label" style="color:${cor}99">Material</div>
      <div class="prompt-text">${exAtual.prompt}</div>
    </div>
    <div class="dica-box">
      <span class="dica-icon">💡</span>
      <div class="dica-tip">${exAtual.dica}</div>
    </div>
    <div class="mode-toggle">
      <button class="mode-btn" id="mode-voz" style="background:${cor};color:#0F0F0F" onclick="setModo('voz')">🎙 Gravar voz</button>
      <button class="mode-btn" id="mode-txt" style="background:none;color:#555" onclick="setModo('texto')">✏️ Escrever</button>
    </div>
    <div id="entrada-area"></div>
    <button class="btn-feedback" id="btn-fb" style="background:#1A1A1A;color:#444" onclick="pedirFeedback()">Receber feedback da IA →</button>
    <div id="fb-area"></div>
  `;
  renderEntrada();
}

function setModo(m) {
  modoEntrada=m;
  const cor=CATS[exAtual.cat].cor;
  document.getElementById("mode-voz").style.cssText=`background:${m==="voz"?cor:"none"};color:${m==="voz"?"#0F0F0F":"#555"}`;
  document.getElementById("mode-txt").style.cssText=`background:${m==="texto"?cor:"none"};color:${m==="texto"?"#0F0F0F":"#555"}`;
  renderEntrada();
}

function renderEntrada() {
  const el=document.getElementById("entrada-area");
  if(modoEntrada==="voz") { el.innerHTML=renderGravadorHTML(); initGravador(); }
  else { el.innerHTML=`<div><div style="font-size:10px;letter-spacing:3px;color:#555;text-transform:uppercase;margin-bottom:8px">Sua resposta</div><textarea class="textarea-resp" id="resp-texto" placeholder="Escreva o que você falou, como foi, o que percebeu..." oninput="atualizarBtnFb()"></textarea></div>`; }
  atualizarBtnFb();
}

function atualizarBtnFb() {
  const conteudo = modoEntrada==="voz" ? transAtual : (document.getElementById("resp-texto")||{value:""}).value;
  const btn=document.getElementById("btn-fb");
  if(!btn) return;
  const cor=CATS[exAtual.cat].cor;
  const tem=conteudo&&conteudo.trim().length>0;
  btn.style.background=tem?cor:"#1A1A1A";
  btn.style.color=tem?"#0F0F0F":"#444";
}

// ── CRONÔMETRO ────────────────────────────────────────────────────────────────
function fmtTime(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function toggleCrono(){
  cronoAtivo=!cronoAtivo;
  const btn=document.getElementById("crono-btn");
  if(cronoAtivo){
    btn.style.background="#1A1A1A"; btn.style.color="#888"; btn.textContent="⏸ Pausar";
    cronoInt=setInterval(()=>{
      if(cronoSeg>0){ cronoSeg--; atualizarCrono(); }
      else { clearInterval(cronoInt); cronoAtivo=false; }
    },1000);
  } else {
    clearInterval(cronoInt);
    btn.style.background="#E8C547"; btn.style.color="#0F0F0F"; btn.textContent="▶ Continuar";
  }
}
function atualizarCrono(){
  const total=exAtual.min*60;
  const num=document.getElementById("crono-num");
  const bar=document.getElementById("crono-bar");
  if(!num||!bar) return;
  num.textContent=fmtTime(cronoSeg);
  num.style.color=cronoSeg<30?"#E87C47":"#F0EDE6";
  bar.style.width=`${(1-cronoSeg/total)*100}%`;
  bar.style.background=cronoSeg<30?"#E87C47":"#E8C547";
}

// ── GRAVADOR ──────────────────────────────────────────────────────────────────
function renderGravadorHTML(){
  return `<div class="gravador">
    <div class="grav-label">🎙 Gravação de voz</div>
    <div class="visualizer" id="visualizer">${Array.from({length:20},(_,i)=>`<div class="bar" id="bar${i}" style="height:4px;background:#222"></div>`).join("")}</div>
    <div id="grav-tempo-area"></div>
    <div class="grav-controls" id="grav-controls">
      <button class="grav-btn-rec" id="btn-rec" style="background:${CATS[exAtual.cat].cor};color:#0F0F0F" onclick="iniciarGravacao()">🎙</button>
    </div>
    <div id="grav-erro" class="grav-erro" style="display:none"></div>
    <div id="trans-area" style="display:none">
      <div class="trans-box"><div class="trans-label" id="trans-label">TRANSCRIÇÃO</div><div class="trans-text" id="trans-text"></div></div>
    </div>
    <div id="analise-area" style="display:none"></div>
  </div>`;
}

function initGravador(){
  barrasEls=Array.from({length:20},(_,i)=>document.getElementById("bar"+i));
  gravEstado="idle"; gravTempo=0; textoFinal=""; transAtual=""; analiseAtual=null;
}

async function iniciarVisualizador(){
  try {
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    micStream=stream;
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser(); analyser.fftSize=64;
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    const buf=new Uint8Array(analyser.frequencyBinCount);
    const cor=CATS[exAtual.cat].cor;
    const loop=()=>{
      analyser.getByteFrequencyData(buf);
      barrasEls.forEach((b,i)=>{
        if(!b) return;
        const h=Math.max(4,Math.min(44,buf[Math.floor(i/20*buf.length)]*0.5));
        b.style.height=h+"px"; b.style.background=cor;
      });
      animFrame=requestAnimationFrame(loop);
    };
    loop();
  } catch(e){}
}

function pararVisualizador(){
  cancelAnimationFrame(animFrame);
  try{audioCtx&&audioCtx.close();}catch(e){}
  micStream&&micStream.getTracks().forEach(t=>t.stop());
  barrasEls.forEach(b=>{if(b){b.style.height="4px";b.style.background="#222";}});
}

function iniciarGravacao(){
  const suportado="SpeechRecognition" in window || "webkitSpeechRecognition" in window;
  if(!suportado){ mostrarErroGrav("Use Safari no iPhone para gravação de voz."); return; }
  textoFinal=""; transAtual=""; analiseAtual=null;
  document.getElementById("grav-erro").style.display="none";
  document.getElementById("trans-area").style.display="none";
  document.getElementById("analise-area").style.display="none";

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR(); recognition.lang="pt-BR"; recognition.continuous=true; recognition.interimResults=true;
  recognition.onresult=e=>{
    let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) textoFinal+=e.results[i][0].transcript+" ";
      else interim=e.results[i][0].transcript;
    }
    transAtual=textoFinal+interim;
    const tt=document.getElementById("trans-text");
    const ta=document.getElementById("trans-area");
    if(tt&&ta){ ta.style.display="block"; document.getElementById("trans-label").textContent="TRANSCREVENDO AO VIVO..."; tt.textContent=transAtual; }
  };
  recognition.onerror=e=>{ mostrarErroGrav(e.error==="not-allowed"?"Permissão de microfone negada nas configurações do Safari.":"Erro: "+e.error); pararGravacao(); };
  recognition.onend=()=>{ try{if(gravEstado==="gravando")recognition.start();}catch(e){} };
  recognition.start();
  gravEstado="gravando"; gravTempo=0;
  gravInt=setInterval(()=>{
    gravTempo++;
    const ta=document.getElementById("grav-tempo-area");
    if(ta) ta.innerHTML=`<div class="grav-tempo">${fmtTime(gravTempo)} <span style="font-size:11px;color:#666">gravando</span></div>`;
  },1000);
  const ctrl=document.getElementById("grav-controls");
  if(ctrl) ctrl.innerHTML=`<button class="grav-btn-stop" onclick="pararGravacao()">⏹</button>`;
  iniciarVisualizador();
}

function pararGravacao(){
  if(gravEstado!=="gravando") return;
  gravEstado="pronto";
  try{recognition&&recognition.stop();}catch(e){}
  recognition=null; clearInterval(gravInt); pararVisualizador();
  const ta=document.getElementById("grav-tempo-area");
  if(ta) ta.innerHTML="";
  transAtual=textoFinal.trim();
  const tt=document.getElementById("trans-text");
  const tl=document.getElementById("trans-label");
  if(tt){ tt.textContent=transAtual||"(silêncio detectado)"; }
  if(tl) tl.textContent="TRANSCRIÇÃO";
  document.getElementById("trans-area").style.display="block";
  analiseAtual=analisar(transAtual);
  if(analiseAtual) renderAnalise(analiseAtual);
  const ctrl=document.getElementById("grav-controls");
  if(ctrl) ctrl.innerHTML=`<button class="grav-btn-reset" onclick="regravacao()">🔄 Regravar</button>`;
  atualizarBtnFb();
}

function regravacao(){
  textoFinal=""; transAtual=""; analiseAtual=null; gravEstado="idle";
  document.getElementById("trans-area").style.display="none";
  document.getElementById("analise-area").style.display="none";
  document.getElementById("grav-tempo-area").innerHTML="";
  const ctrl=document.getElementById("grav-controls");
  const cor=CATS[exAtual.cat].cor;
  if(ctrl) ctrl.innerHTML=`<button class="grav-btn-rec" style="background:${cor};color:#0F0F0F" onclick="iniciarGravacao()">🎙</button>`;
  barrasEls.forEach(b=>{if(b){b.style.height="4px";b.style.background="#222";}});
  atualizarBtnFb();
}

function mostrarErroGrav(msg){
  const el=document.getElementById("grav-erro");
  if(el){ el.style.display="block"; el.textContent=msg; }
}

function renderAnalise(a){
  const el=document.getElementById("analise-area");
  if(!el) return;
  const scoreCor=a.score>70?"#47E8B8":a.score>40?"#E8C547":"#E87C47";
  const vicCor=a.tv>3?"#E87C47":"#47E8B8";
  let vic="";
  Object.entries(a.vic).forEach(([v,c])=>{ vic+=`<span class="vicio-tag">"${v}" ×${c}</span>`; });
  el.style.display="block";
  el.innerHTML=`
    <div style="font-size:10px;letter-spacing:3px;color:#555;text-transform:uppercase;margin-bottom:10px">Análise automática</div>
    <div class="analise-grid">
      <div class="analise-card"><div class="analise-val" style="color:#E8C547">${a.total}</div><div class="analise-lbl">palavras</div></div>
      <div class="analise-card"><div class="analise-val" style="color:${vicCor}">${a.tv}</div><div class="analise-lbl">vícios</div></div>
      <div class="analise-card"><div class="analise-val" style="color:${scoreCor}">${a.score}%</div><div class="analise-lbl">clareza</div></div>
    </div>
    <div style="margin-bottom:10px">
      <div style="font-size:11px;color:#666;margin-bottom:4px">Clareza: ${a.score}%</div>
      <div style="background:#1A1A1A;border-radius:20px;height:6px;overflow:hidden"><div style="width:${a.score}%;height:100%;background:${scoreCor};border-radius:20px;transition:width 0.8s"></div></div>
    </div>
    ${vic?`<div style="font-size:10px;color:#555;margin-bottom:5px">VÍCIOS NA FALA</div><div class="vicios-wrap">${vic}</div>`:""}
  `;
}

// ── FEEDBACK IA ───────────────────────────────────────────────────────────────
async function pedirFeedback(){
  const conteudo=modoEntrada==="voz"?transAtual:(document.getElementById("resp-texto")||{value:""}).value;
  if(!conteudo||!conteudo.trim()) return;
  const btn=document.getElementById("btn-fb");
  btn.textContent="Analisando..."; btn.disabled=true;
  const a=analiseAtual||analisar(conteudo);
  const extra=a?`\n\nMétricas: ${a.total} palavras, ${a.tv} vícios (${Object.keys(a.vic).join(", ")||"nenhum"}), clareza ${a.score}%.`:"";
  try {
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",max_tokens:1000,
        system:"Você é um coach especialista em comunicação e oratória em português brasileiro. Analise a fala do usuário de forma construtiva: 1) O que está bom (seja específico) 2) Um ponto concreto de melhoria 3) Uma dica prática para aplicar agora. Máximo 4 frases, em prosa natural, sem bullets.",
        messages:[{role:"user",content:`Exercício: "${exAtual.titulo}"\nInstrução: ${exAtual.inst}\nPrompt: ${exAtual.prompt}\n\nFala: "${conteudo}"${extra}`}]
      })
    });
    const d=await res.json();
    const txt=d.content?.map(b=>b.text||"").join("")||"Erro ao gerar feedback.";
    salvarHist({titulo:exAtual.titulo,cat:exAtual.cat,score:a?.score||Math.round(Math.random()*25+70),data:Date.now()});
    const cor=CATS[exAtual.cat].cor;
    btn.style.display="none";
    document.getElementById("fb-area").innerHTML=`
      <div class="fb-box">
        <div class="fb-label" style="color:${cor}">✦ Feedback do Coach</div>
        <div class="fb-text">${txt}</div>
        <button class="btn-proximo" style="background:${cor};color:#0F0F0F" onclick="voltarHome()">Próximo exercício →</button>
      </div>`;
  } catch(e) {
    btn.textContent="Receber feedback da IA →"; btn.disabled=false;
    document.getElementById("fb-area").innerHTML=`<p style="color:#E87C47;font-size:13px;text-align:center">Erro de conexão. Tente novamente.</p>`;
  }
}

// ── SIMULAÇÃO ─────────────────────────────────────────────────────────────────
function abrirSim(id){
  simAtual=SIMS.find(s=>s.id===id); if(!simAtual) return;
  simMsgs=[{role:"assistant",content:`${simAtual.cenario}\n\nPode começar — estou no papel de ${simAtual.papel}.`}];
  document.getElementById("sim-badge").textContent=`🎭 ${simAtual.titulo}`;
  document.getElementById("sim-badge").style.cssText=`background:${simAtual.cor}22;color:${simAtual.cor};font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;border-radius:20px`;
  const send=document.getElementById("chat-send");
  send.style.background=simAtual.cor; send.style.color="#0F0F0F";
  renderChat(); showScreen("simulacao");
}

function renderChat(){
  const area=document.getElementById("chat-area");
  area.innerHTML=simMsgs.map(m=>`
    <div style="display:flex;justify-content:${m.role==="user"?"flex-end":"flex-start"}">
      <div class="msg ${m.role==="user"?"user":"bot"}" style="${m.role==="user"?`background:${simAtual.cor}22;border:1px solid ${simAtual.cor}55`:""}">
        ${m.content.replace(/\n/g,"<br>")}
      </div>
    </div>`).join("");
  if(simLoad) area.innerHTML+=`<div style="display:flex"><div class="typing">${[0,1,2].map(i=>`<div class="typing-dot" style="animation:pulse 1.2s ${i*0.2}s infinite"></div>`).join("")}</div></div>`;
  area.scrollTop=area.scrollHeight;
}

async function enviarMsg(){
  const inp=document.getElementById("chat-input");
  const txt=inp.value.trim(); if(!txt||simLoad) return;
  inp.value="";
  simMsgs.push({role:"user",content:txt});
  simLoad=true; renderChat();
  try {
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",max_tokens:1000,
        system:`Você é um simulador de comunicação em português brasileiro. Cenário: ${simAtual.cenario}. Papel: ${simAtual.papel}. Responda de forma realista e desafiadora. Após 4-5 trocas, dê feedback construtivo curto. Máx 3 parágrafos.`,
        messages:simMsgs.map(m=>({role:m.role,content:m.content}))
      })
    });
    const d=await res.json();
    const txt2=d.content?.map(b=>b.text||"").join("")||"...";
    simMsgs.push({role:"assistant",content:txt2});
  } catch(e){ simMsgs.push({role:"assistant",content:"Erro de conexão."}); }
  simLoad=false; renderChat();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderExercicios();
renderSims();
renderDicas();
atualizarStats();
</script>
